[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyband"
version = "0.1.0"
description = "Polynomial trend with a polynomial-width band: fit the scatter, not just the mean"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Etienne Artigau" }]
keywords = ["fitting", "regression", "heteroscedastic", "scatter", "envelope", "matplotlib"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.4"]
dev = ["matplotlib>=3.4", "pytest>=7.0"]

[project.urls]
Homepage = "https://eartigau.github.io/polyband/"
Source = "https://github.com/eartigau/polyband"
Issues = "https://github.com/eartigau/polyband/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
